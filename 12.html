<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TSDB App V35</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
        body { background-color: #020617; font-family: 'Inter', sans-serif; color: #f8fafc; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 4px; }

        /* NEON RED PULSE ALERT FOR TABS */
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .tab-wrap { display: flex; gap: 6px; background: #0f172a; padding: 6px; border-radius: 12px; border: 2px solid #334155; overflow-x: auto; white-space: nowrap; }
        .tab-wrap.multi { animation: pulseRed 2s infinite; border-color: #ef4444; }
        .tab-btn { padding: 8px 16px; border-radius: 8px; font-weight: 800; color: #94a3b8; cursor: pointer; transition: 0.2s; text-transform: uppercase; border: 1px solid transparent; font-size: 0.8rem; }
        .tab-btn.active { background: #7c3aed; color: white; border-color: #6d28d9; box-shadow: 0 4px 10px rgba(124, 58, 237, 0.4); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* V31 SEARCH STYLE RESTORED */
        .s-container { position: relative; width: 100%; z-index: 50; }
        .s-input { width: 100%; background: #1e293b; border: 1px solid #334155; color: white; padding: 14px 44px 14px 44px; border-radius: 14px; font-size: 1rem; outline: none; transition: 0.3s; font-weight: 500; }
        .s-input:focus { border-color: #a855f7; box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.2), inset 0 2px 4px rgba(0,0,0,0.2); background: #0f172a; }
        
        /* PURPLE X BUTTON */
        .s-clear { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #a855f7; cursor: pointer; display: none; font-size: 1.2rem; transition: 0.2s; }
        .s-clear:hover { color: #fff; transform: scale(1.1) translateY(-45%); }
        
        /* PURPLE HIGHLIGHTS */
        .s-list { position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border: 1px solid #334155; border-radius: 16px; margin-top: 8px; max-height: 350px; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.9); display: none; z-index: 100; }
        .s-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; transition: 0.1s; }
        .s-item:hover { background: #2e1065; }
        .s-hl { color: #c084fc; font-weight: 900; text-shadow: 0 0 10px rgba(192, 132, 252, 0.3); }

        /* DATA ROWS */
        .d-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 0; }
        .d-row:last-child { border-bottom: none; }
        .d-lbl { color: #94a3b8; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; min-width: 80px; }
        .d-val { color: #fff; font-size: 0.85rem; font-weight: 600; text-align: right; font-family: 'JetBrains Mono'; overflow-wrap: anywhere; word-break: break-word; margin-left: 10px; }
        @media (max-width: 640px) { .d-row { display: block; } .d-lbl { display: block; margin-bottom: 3px; } .d-val { display: block; text-align: left; margin-left: 0; } }

        /* VERTICAL OVEN TABLE */
        .v-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .v-table th, .v-table td { padding: 8px 6px; border-bottom: 1px solid #1e293b; text-align: center; }
        .v-table th { background: #1e293b; color: #94a3b8; font-weight: 800; font-size: 0.7rem; }
        .z-col { font-weight: 800; color: #94a3b8; background: #1e293b; width: 40px; border-right: 1px solid #334155; }
        .t-col { color: #f87171; font-family: 'JetBrains Mono'; font-weight: 800; background: rgba(239, 68, 68, 0.05); }
        .b-col { color: #60a5fa; font-family: 'JetBrains Mono'; font-weight: 800; background: rgba(59, 130, 246, 0.05); }
        .c-col { color: #34d399; font-family: 'JetBrains Mono'; font-weight: 800; background: rgba(52, 211, 153, 0.05); }

        /* FLASH ANIMATION */
        @keyframes textFlash { 0%, 100% { color: white; } 50% { color: #d8b4fe; text-shadow: 0 0 10px #d8b4fe; } }
        @keyframes bodyFlash { 0% { opacity: 1; } 50% { opacity: 0.5; transform: translateY(2px); } 100% { opacity: 1; transform: translateY(0); } }
        .data-flash { animation: textFlash 0.4s ease-out; }
        .body-flash { animation: bodyFlash 0.3s ease-out; }
    </style>
</head>

            const cycleCard = dcard('CIKLUSIDŐK', cycleNames.map((x,n)=>r(x,(i.cycle||[])[n])).join(''), 'fa-stopwatch');
            const morePrograms = dcard('TOVÁBBI PROGRAMOK', [r('X-RAY',pg.x),r('ICT',pg.ict),r('BC1',pg.b1),r('BC2',pg.b2),r('BC3',pg.b3),r('POST-REFLOW AOI',pg.pa),r('IC PROGRAM 1',pg.ic1),r('IC PROGRAM 2',pg.ic2)].join(''), 'fa-code');
            const lineSetup = dcard('FOLYAMAT ÉS POZICIONÁLÁS', [r('F VÁLTÁSI IDŐ',(i.change||[])[0]),r('A VÁLTÁSI IDŐ',(i.change||[])[1]),r('R VÁLTÁSI IDŐ',(i.change||[])[2]),r('C VÁLTÁSI IDŐ',(i.change||[])[3]),r('S VÁLTÁSI IDŐ',(i.change||[])[4]),r('HDP SZÜKSÉGES',i.hdp),r('PCB RÖGZÍTÉS',d.fix),r('DISPENSER ALÁTÁMASZTÁS',d.disp),r('MAGAZIN JIG',d.mag),r('LOADER PITCH',d.loader),r('UNLOADER PITCH',d.unloader)].join(''), 'fa-project-diagram');

            return `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6">
                <div class="lg:col-span-3 space-y-4">
                    <div class="bg-slate-800/40 p-4 lg:p-5 rounded-2xl border border-slate-700/50 shadow-sm">
                        <h3 class="text-blue-400 text-xs font-black uppercase mb-3 border-b border-blue-500/20 pb-2"><i class="fas fa-ruler-combined mr-2"></i> FIZIKAI ADATOK</h3>
                        <div class="flex gap-2 mb-2">
                            <div class="flex-1 bg-slate-900/50 p-2 rounded border border-slate-700 text-center"><span class="text-[9px] text-slate-500 font-bold block">SZÉLESSÉG</span><span class="text-white font-mono font-bold">${dm.w||'-'}</span></div>
                            <div class="flex-1 bg-slate-900/50 p-2 rounded border border-slate-700 text-center"><span class="text-[9px] text-slate-500 font-bold block">HOSSZÚSÁG</span><span class="text-white font-mono font-bold">${dm.l||'-'}</span></div>
                        </div>
                        ${r('VASTAGSÁG (MM)', dm.t)} ${r('PANEL / BLOKK', dm.sh)} ${r('CÍMKE', m.l)}
                    </div>
                    
                    <div class="bg-slate-800/40 p-4 lg:p-5 rounded-2xl border border-slate-700/50 shadow-sm">
                        <h3 class="text-purple-400 text-xs font-black uppercase mb-3 border-b border-purple-500/20 pb-2"><i class="fas fa-cogs mr-2"></i> EGYÉB FOLYAMATOK</h3>
                        ${pb('RAGASZTÓ PROG', pg.g)} ${r('RAGASZTÓ TÍPUS', m.g)}
                        <div class="my-2 border-t border-white/5"></div>
                        ${pb('LÉZER PROG', pg.n)} ${pb('SPI PROG', pg.s)} ${pb('BEÜLTETŐ PROG', pg.sm)} ${pb('AOI PROG', pg.a)}
                        <div class="my-2 border-t border-white/5"></div>
                        ${r('JUKI SUPPORT', m.j)}
                    </div>
                </div>

                <div class="lg:col-span-4">
                    <div class="bg-gradient-to-b from-slate-800/60 to-slate-900/60 p-4 lg:p-6 rounded-2xl border border-purple-500/30 shadow-lg relative overflow-hidden h-full">
                        <div class="absolute top-0 right-0 p-12 bg-purple-500/5 blur-2xl rounded-full pointer-events-none"></div>
                        <h3 class="text-purple-400 text-sm font-black uppercase mb-4 border-b border-purple-500/30 pb-2 tracking-widest flex items-center relative z-10"><i class="fas fa-print mr-3 text-lg"></i> MPM NYOMTATÁS</h3>
                        
                        ${pasteBox}
                        ${maskBox}

                        ${prn}
                        ${mpmExtra}
                        
                        <div class="mt-4 pt-3 border-t border-slate-700/50">
                            ${r('MPM SUPPORT', m.m)}
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-5 space-y-6">
                    ${ovn}
                    ${mkOven(d.o7, 7)}
                    ${mkOven(d.o8, 8)}
                    ${mkOven(d.o10, 10)}
                </div>
            </div>
            <div class="mt-6 pt-6 border-t border-slate-700/50">
                <div class="text-[10px] text-slate-500 font-black uppercase tracking-widest mb-3">Részletes TSDB adatok</div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    ${lineSetup}
                    ${morePrograms}
                    ${cycleCard}
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
                    ${fullMachineCard('PANASONIC SPV-DC · TELJES GÉPADAT', (d.tools||{}).sppv||[], (d.prs||{}).sppv||[], sppvParamLabels)}
                    ${fullMachineCard('HITACHI PXH-1 · TELJES GÉPADAT', (d.tools||{}).pxh||[], (d.prs||{}).pxh||[], pxhParamLabels)}
                </div>
            </div>`;
        }

        function mkOven(o, z) {
            if(!o || (!o.t.some(ok) && !o.b.some(ok))) return '';
            
            let rows = '';
            for(let i=1; i<=z; i++) {
                rows += `<tr><td class="z-col text-slate-400">Z${i}</td><td class="t-col">${o.t[i-1]||'-'}</td><td class="b-col">${o.b[i-1]||'-'}</td></tr>`;
            }
            const ct = z===8?o.ct:o.ct, cb = z===8?['-','-']:o.cb;
            rows += `<tr><td class="z-col text-teal-500 border-t-2 border-slate-700">C1</td><td class="c-col border-t-2 border-slate-700">${ct[0]||'-'}</td><td class="c-col border-t-2 border-slate-700">${cb[0]||'-'}</td></tr>`;
            rows += `<tr><td class="z-col text-teal-500">C2</td><td class="c-col">${ct[1]||'-'}</td><td class="c-col">${cb[1]||'-'}</td></tr>`;

            const pBox = (l, v) => ok(v) ? `<div class="bg-slate-900 p-2 rounded-lg border border-slate-800 text-center"><div class="text-[9px] text-slate-500 font-bold uppercase">${l}</div><div class="text-white text-xs font-bold font-mono">${v}</div></div>` : '';

            return `
            <div class="bg-slate-800/80 p-1 rounded-2xl border border-slate-700 shadow-md overflow-hidden">
                <div class="px-4 py-3 border-b border-slate-700 bg-slate-900">
                    <div class="flex justify-between items-center mb-3">
                        <div class="text-xs font-black text-orange-500 uppercase tracking-widest"><i class="fas fa-fire-alt mr-2"></i> ${z} ZÓNÁS</div>
                    </div>
                    <div class="grid grid-cols-4 gap-2">
                        ${pBox('SEB', o.sp)} ${pBox('O2', o.o2)} ${pBox('SZÉL', o.w)} ${pBox('SUP', o.su)}
                    </div>
                </div>
                <table class="v-table">
                    <thead><tr><th class="z-col border-r border-slate-700">#</th><th class="text-red-400 w-1/2">FELSŐ</th><th class="text-blue-400 w-1/2">ALSÓ</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
        }
    </script>
</body>
</html>
