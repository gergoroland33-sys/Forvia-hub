
<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORVIA · Átállási terv készítő</title>
<style>
  :root{--bg:#091426;--panel:#101f36;--panel2:#132744;--line:#2a4266;--text:#edf5ff;--muted:#98aac5;--blue:#3983ff;--cyan:#18c8e8;--green:#29d49a;--amber:#ffb449;--red:#ff5e70;--purple:#9666ff}
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(900px 550px at 10% -15%,#164c84 0%,transparent 60%),radial-gradient(800px 450px at 95% 0,#382175 0%,transparent 55%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
  header{padding:28px max(20px,calc((100vw - 1280px)/2));border-bottom:1px solid #223957;background:rgba(7,17,33,.74);backdrop-filter:blur(12px)} h1{margin:0;font-size:clamp(22px,3vw,34px);letter-spacing:.03em} header p{margin:7px 0 0;color:var(--muted);font-size:14px}.wrap{width:min(1280px,calc(100% - 32px));margin:24px auto 56px}.section{background:linear-gradient(145deg,rgba(19,39,68,.92),rgba(12,29,51,.92));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 15px 45px rgba(0,0,0,.2)}
  .inputs{display:grid;grid-template-columns:1fr 1fr;gap:16px}.input-group{border:1px solid #304a6f;border-radius:14px;padding:15px;background:#0c1b31}.input-group h2{font-size:15px;margin:0 0 12px}.input-group.current h2{color:#77b5ff}.input-group.next h2{color:#b49aff}.field{display:grid;gap:6px;margin-top:10px}.field label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}.field input{width:100%;padding:10px;border:1px dashed #3e5c84;border-radius:9px;background:#081426;color:var(--muted);font:inherit;font-size:13px}.field small{color:#7890b0;font-size:11px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,#2874ee,#1aaed0);color:#fff;font-weight:800;cursor:pointer;font:inherit}button:hover{filter:brightness(1.12)}button.secondary{background:#203958;border:1px solid #345477}.status{font-size:13px;color:var(--muted)}
  #planner{display:none;margin-top:20px}.selectors{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}.select-card{padding:15px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.select-card label{display:block;font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:8px}.select-card select{width:100%;border:1px solid #36567f;background:#0b1830;color:var(--text);padding:11px;border-radius:9px;font:inherit;font-weight:700}
  .summary{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:12px;margin-bottom:18px}.metric{padding:15px;border-radius:13px;border:1px solid #2c4567;background:linear-gradient(145deg,#112541,#0d1c31)}.metric b{display:block;font-size:26px}.metric span{font-size:12px;color:var(--muted)}.metric.move b{color:var(--purple)}.metric.swap b{color:var(--amber)}.metric.add b{color:var(--green)}.metric.remove b{color:var(--red)}.metric.keep b{color:var(--cyan)}
  .notice{border-left:4px solid var(--cyan);background:#0d2942;color:#cceeff;padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:18px}.plan-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:18px}.plan-title{font-size:17px;margin:0 0 12px}.machine{border:1px solid #2d486b;border-radius:13px;overflow:hidden;margin-bottom:12px;background:#0b192c}.machine h3{padding:11px 14px;margin:0;font-size:14px;background:#132a48;border-bottom:1px solid #2d486b}.op{display:grid;grid-template-columns:112px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid #1d3657;font-size:13px}.op:last-child{border-bottom:0}.tag{font-size:11px;font-weight:900;letter-spacing:.04em;padding:5px 7px;border-radius:6px;text-align:center}.tag.csere{background:#4b3417;color:#ffd18a}.tag.ath{background:#33255a;color:#d0beff}.tag.uj{background:#113d32;color:#7df4c1}.tag.kivetel{background:#491f29;color:#ffadb7}.tag.marad{background:#12384a;color:#83dcf5}.pos{color:#8da5c8;font-size:12px;white-space:nowrap}.op strong{color:#fff}.side-card{border:1px solid #2d486b;border-radius:13px;padding:14px;background:#0b192c}.side-card h3{margin:0 0 10px;font-size:14px}.placement-row{padding:10px 0;border-bottom:1px solid #1d3657;font-size:13px}.placement-row:last-child{border-bottom:0}.delta-up{color:#7df4c1}.delta-down{color:#ffadb7}.empty{padding:22px;color:var(--muted);text-align:center;border:1px dashed #395675;border-radius:12px}.hidden{display:none!important}
  @media(max-width:820px){.inputs,.selectors,.plan-grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.op{grid-template-columns:90px 1fr}.op .pos{grid-column:2}.wrap{width:min(100% - 20px,1280px)}header{padding:20px}.section{padding:14px}}
  @media print{body{background:#fff;color:#111}.no-print,header p{display:none}.wrap{width:100%;margin:0}.section,.machine,.side-card,.metric{box-shadow:none;background:#fff;border-color:#aaa;color:#111}.op strong,h1,.machine h3,.side-card h3{color:#111}.machine h3{background:#f1f4f8}.status,.metric span,.pos{color:#555}}
</style>
</head>
<body>
<header><h1>FORVIA · Átállási terv készítő</h1><p>Két modell feederbank- és beültetési adatainak biztonságos összehasonlítása.</p></header>
<main class="wrap">
  <section id="loadingPanel" class="section no-print"><div class="notice"><strong>Adatbázis betöltése…</strong><br><span id="status">A rendszer automatikusan beolvassa a mellette lévő bank.csv és ultetes.csv fájlt.</span></div></section>
  <section id="planner" class="section">
    <div class="selectors no-print"><div class="select-card"><label>Jelenlegi modell</label><select id="currentModel"></select></div><div class="select-card"><label>Következő modell</label><select id="nextModel"></select></div></div>
    <div class="actions no-print"><button id="printBtn" class="secondary">Nyomtatás</button></div>
    <div id="summary" class="summary"></div><div id="notice" class="notice"></div>
    <div class="plan-grid"><div><h2 class="plan-title">Feederbank átállási sorrend</h2><div id="plan"></div></div><aside class="side-card"><h3>Beültetési eltérések</h3><div id="placementChanges"></div></aside></div>
  </section>
</main>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const state={current:{bank:[],placement:[]},next:{bank:[],placement:[]}};
  const normalize=value=>String(value??'').trim().replace(/^\uFEFF/,'');
  const keyName=value=>normalize(value).toLocaleLowerCase('hu-HU').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  const aliases={machine:['gepazonositoszam','gep'],location:['feederlokacio','feederhely','lokacio'],part:['cikkszam','alkatresz','part'],model:['model','modell'],side:['oldal'],count:['beultetettmennyiseg','dbpanel','darabpanel','mennyiseg']};
  const parseCsv=text=>{const delimiter=(text.match(/;/g)||[]).length>=(text.match(/,/g)||[]).length?';':',';const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===delimiter&&!quoted){row.push(normalize(cell));cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(normalize(cell));if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}row.push(normalize(cell));if(row.some(Boolean))rows.push(row);if(!rows.length)throw new Error('Üres CSV.');const headers=rows.shift().map(keyName);return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,normalize(values[i])])))};
  const value=(row,field)=>{const found=aliases[field].find(name=>Object.prototype.hasOwnProperty.call(row,name));return found?row[found]:''};
  const makeBank=rows=>rows.map(row=>({machine:value(row,'machine'),location:value(row,'location'),part:value(row,'part'),model:value(row,'model')})).filter(row=>row.machine&&row.location&&row.part&&row.model);
  const makePlacement=rows=>rows.map(row=>({part:value(row,'part'),side:value(row,'side').toUpperCase(),model:value(row,'model'),count:Number(String(value(row,'count')).replace(',','.'))||0})).filter(row=>row.part&&row.model);
  const readRelative=async(kind)=>{const fileName=kind==='bank'?'bank.csv':'ultetes.csv';const response=await fetch(fileName);if(!response.ok)throw new Error(`${fileName} nem tölthető be (${response.status}).`);const rows=parseCsv(await response.text());const data=kind==='bank'?makeBank(rows):makePlacement(rows);if(!data.length)throw new Error(`${fileName} nem tartalmaz érvényes adatot.`);return data};
  const unique=items=>[...new Set(items.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'hu'));
  const positionKey=row=>`${row.machine}|${row.location}`;
  const modelRows=(which,model)=>state[which].bank.filter(row=>row.model===model);
  const placementRows=(which,model)=>state[which].placement.filter(row=>row.model===model);
  const addMetric=(type,value,label)=>`<div class="metric ${type}"><b>${value}</b><span>${label}</span></div>`;
  const escape=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  function render(){const currentModel=$('currentModel').value,nextModel=$('nextModel').value;if(!currentModel||!nextModel)return;const current=modelRows('current',currentModel),next=modelRows('next',nextModel);const currentMap=new Map(current.map(row=>[positionKey(row),row])),nextMap=new Map(next.map(row=>[positionKey(row),row]));const operations=[],removed=[],added=[];
    unique([...currentMap.keys(),...nextMap.keys()]).forEach(pos=>{const before=currentMap.get(pos),after=nextMap.get(pos);if(before&&after&&before.part===after.part)operations.push({type:'marad',machine:before.machine,loc:before.location,before,after});else if(before&&after)operations.push({type:'csere',machine:before.machine,loc:before.location,before,after});else if(before)removed.push(before);else if(after)added.push(after)});
    const available=new Map();removed.forEach(row=>{if(!available.has(row.part))available.set(row.part,[]);available.get(row.part).push(row)});const moved=[];const trulyAdded=[];added.forEach(row=>{const old=available.get(row.part);if(old&&old.length){moved.push({type:'ath',machine:row.machine,loc:row.location,before:old.shift(),after:row});if(!old.length)available.delete(row.part)}else trulyAdded.push(row)});const trulyRemoved=[...available.values()].flat().map(row=>({type:'kivetel',machine:row.machine,loc:row.location,before:row}));operations.push(...moved,...trulyAdded.map(row=>({type:'uj',machine:row.machine,loc:row.location,after:row})),...trulyRemoved);
    const ordered=operations.sort((a,b)=>String(a.machine).localeCompare(String(b.machine),undefined,{numeric:true})||String(a.loc).localeCompare(String(b.loc),undefined,{numeric:true})||a.type.localeCompare(b.type));
    $('summary').innerHTML=addMetric('keep',operations.filter(x=>x.type==='marad').length,'változatlan pozíció')+addMetric('swap',operations.filter(x=>x.type==='csere').length,'helyben cserélendő')+addMetric('move',moved.length,'áthelyezendő feeder')+addMetric('add',trulyAdded.length,'új betét')+addMetric('remove',trulyRemoved.length,'kiveendő feeder');
    $('notice').textContent=`${currentModel} → ${nextModel}. A terv a P-DAT-alapú Bank CSV gép–feederpozícióit hasonlítja össze. Az „Áthelyezés” azonos cikkszám két külön feederhelye között történik.`;
    const grouped=new Map();ordered.forEach(op=>{const key=`GÉP ${op.machine}`;if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(op)});$('plan').innerHTML=grouped.size?[...grouped].map(([machine,ops])=>`<section class="machine"><h3>${machine}</h3>${ops.map(op=>operationHtml(op)).join('')}</section>`).join(''):'<div class="empty">Nincs feederbank-adat a kiválasztott modellekhez.</div>';
    renderPlacement(currentModel,nextModel);
  }
  function operationHtml(op){let text='',pos='';if(op.type==='marad'){text=`<strong>${escape(op.after.part)}</strong> marad a helyén`;pos=`${escape(op.loc)}`}if(op.type==='csere'){text=`<strong>${escape(op.before.part)}</strong> helyére <strong>${escape(op.after.part)}</strong>`;pos=escape(op.loc)}if(op.type==='ath'){text=`<strong>${escape(op.after.part)}</strong> áthelyezése`;pos=`${escape(op.before.location)} → ${escape(op.loc)}`}if(op.type==='uj'){text=`<strong>${escape(op.after.part)}</strong> új betétele`;pos=escape(op.loc)}if(op.type==='kivetel'){text=`<strong>${escape(op.before.part)}</strong> kivétele`;pos=escape(op.loc)}const labels={marad:'MARAD',csere:'CSERE',ath:'ÁTHELYEZÉS',uj:'ÚJ BETÉT',kivetel:'KIVÉTEL'};return `<div class="op"><span class="tag ${op.type}">${labels[op.type]}</span><span>${text}</span><span class="pos">${pos}</span></div>`}
  function renderPlacement(currentModel,nextModel){const before=new Map(),after=new Map();placementRows('current',currentModel).forEach(row=>before.set(`${row.part}|${row.side}`,row));placementRows('next',nextModel).forEach(row=>after.set(`${row.part}|${row.side}`,row));if(!before.size&&!after.size){$('placementChanges').innerHTML='<div class="empty">Nem töltöttél be ültetési CSV-t.</div>';return}const differences=[];unique([...before.keys(),...after.keys()]).forEach(key=>{const a=before.get(key),b=after.get(key),oldCount=a?.count||0,newCount=b?.count||0;if(oldCount!==newCount){const item=b||a;differences.push({part:item.part,side:item.side,oldCount,newCount})}});$('placementChanges').innerHTML=differences.length?differences.sort((a,b)=>a.part.localeCompare(b.part,'hu')).map(row=>{const delta=row.newCount-row.oldCount,cls=delta>0?'delta-up':'delta-down',change=delta>0?`+${delta}`:String(delta);return `<div class="placement-row"><strong>${escape(row.part)}</strong> · ${escape(row.side||'—')}<br><span>${row.oldCount} → ${row.newCount} db/panel · <b class="${cls}">${change}</b></span></div>`}).join(''):'<div class="empty">Nincs darab/panel eltérés.</div>'}
  function fillSelect(id,models,preferred){const select=$(id),previous=select.value;select.innerHTML=models.map(model=>`<option value="${escape(model)}">${escape(model)}</option>`).join('');select.value=models.includes(previous)?previous:(models.includes(preferred)?preferred:models[0]||'')}
  async function load(){try{$('status').textContent='bank.csv és ultetes.csv feldolgozása...';[state.current.bank,state.current.placement]=await Promise.all([readRelative('bank'),readRelative('placement')]);state.next.bank=state.current.bank;state.next.placement=state.current.placement;const models=unique([...state.current.bank.map(x=>x.model),...state.current.placement.map(x=>x.model)]);fillSelect('currentModel',models);fillSelect('nextModel',models,models[1]||models[0]);$('planner').style.display='block';$('loadingPanel').style.display='none';render()}catch(error){$('status').textContent=`Hiba: ${error.message}`;console.error(error)}}
  $('currentModel').addEventListener('change',render);$('nextModel').addEventListener('change',render);$('printBtn').addEventListener('click',()=>window.print());load();
})();
</script>
</body></html>
